# CI 再スキャン層 — pre-commit（gitleaks + semgrep）の --no-verify すり抜けを拾う
# 正本テンプレート: ~/.git-templates/security-scan.yml（配布: 2026-08-25 オーナー承認・全開発環境採用）
# gitleaks は action ではなく素の CLI を使う（gitleaks-action は組織リポでライセンス必須のため）
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # .gitleaks-llm.toml（LLMプロバイダ補完ルール＋allowlist）があればローカル層と同じ基準で走査する
      - run: |
          if [ -f .gitleaks-llm.toml ]; then
            gitleaks dir --redact --no-banner -c .gitleaks-llm.toml .
          else
            gitleaks dir --redact --no-banner .
          fi

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: semgrep scan --config=auto --error
